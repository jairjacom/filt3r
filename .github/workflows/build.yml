name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Fetch hev-socks5-tunnel (pinned tag and submodules)
        run: scripts/fetch-hev.sh

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: List APK output
        run: ls -l app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v7
        with:
          name: filt3r-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
