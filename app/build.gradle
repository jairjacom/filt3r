plugins {
    id 'com.android.application'
}

def appVersion = '0.0.1'

base {
    archivesName = "filt3r-${appVersion}"
}

android {
    namespace 'com.bridge.filt3r'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bridge.filt3r'
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName appVersion
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            ndkBuild {
                targets 'hev-socks5-tunnel'
                arguments 'REV_ID=c5584fe'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
