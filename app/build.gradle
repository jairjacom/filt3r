plugins {
    id 'com.android.application'
}

def appVersion = '0.0.5'

base {
    archivesName = "filt3r-${appVersion}"
}

android {
    namespace 'com.bridge.filt3r'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bridge.filt3r'
        minSdk 36
        targetSdk 36
        versionCode 5
        versionName appVersion
        manifestPlaceholders = [appLabel: 'filt3r']
        if (project.hasProperty('testBuild')) {
            // Side-by-side test app (CI builds on branches): own package and label, never replaces the real app.
            applicationIdSuffix '.test'
            manifestPlaceholders = [appLabel: 'filt3r test']
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            ndkBuild {
                targets 'hev-socks5-tunnel'
                arguments 'REV_ID=c5584fe'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    signingConfigs {
        release {
            // Filled only when the release job provides a keystore; a plain local build stays unsigned.
            if (System.getenv('RELEASE_STORE_FILE')) {
                storeFile file(System.getenv('RELEASE_STORE_FILE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_STORE_PASSWORD') // PKCS12: key and store share one password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.google.android.material:material:1.14.0'
}
