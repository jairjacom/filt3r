plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jairjacom.filt3r'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jairjacom.filt3r'
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName '0.0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
